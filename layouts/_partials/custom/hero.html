{{/* 首页 Hero 横幅：赛博朋克 · SpaceX 星际风格，多图随机轮播 */}}
{{ $banners := resources.Match "img/banner/*" }}
{{ with $banners }}
<section class="cyber-hero" id="cyberHero" aria-label="站点横幅">
    {{ range $i, $img := . }}
        <div class="cyber-hero__bg{{ if eq $i 0 }} is-active{{ end }}"
            style="background-image:url('{{ $img.RelPermalink }}')"></div>
    {{ end }}
    <div class="cyber-hero__overlay"></div>
    <div class="cyber-hero__grid"></div>
    <div class="cyber-hero__content">
        <p class="cyber-hero__kicker">// WELCOME TO DRSTONE'S GRID</p>
        <h1 class="cyber-hero__title">{{ $.Site.Title }}</h1>
        <p class="cyber-hero__subtitle">{{ $.Site.Params.sidebar.subtitle }}</p>
        <div class="cyber-hero__tags">
            <span class="cyber-chip">🚀 SpaceX</span>
            <span class="cyber-chip cyber-chip--pink">✦ 2D 美少女</span>
            <span class="cyber-chip">📈 量化研究</span>
        </div>
    </div>
</section>
<script>
    (function () {
        var bgs = document.querySelectorAll('#cyberHero .cyber-hero__bg');
        if (bgs.length > 1) {
            var cur = Math.floor(Math.random() * bgs.length);
            for (var i = 0; i < bgs.length; i++) {
                bgs[i].classList.toggle('is-active', i === cur);
            }
            setInterval(function () {
                bgs[cur].classList.remove('is-active');
                cur = (cur + 1) % bgs.length;
                bgs[cur].classList.add('is-active');
            }, 7000);
        }
    })();
</script>
{{ end }}
