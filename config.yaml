# ↓↓↓ 已改为你的真实地址 ↓↓↓
baseURL: "https://drstone-youqiong.github.io/"
languageCode: "zh-cn"
locale: "zh-cn"                # Hugo v0.158+ 用 locale，不加会有 languageCode 弃用警告（仅警告，不影响运行）
theme: "hugo-theme-stack"
title: "DrStone 的博客"          # 网站标题
copyright: "© 2026 DrStone"   # 底部版权

# 分页：每页显示几篇文章
pagination:
  pagerSize: 5

# Stack 主题的核心配置
params:
  mainSections:
    - post                     # 首页展示 content/post 目录下的文章

  # 左侧个人信息卡片
  sidebar:
    subtitle: "记录、分享、成长"   # 头像下的一句话简介
    avatar: img/avatar.png       # 头像：直接写字符串路径，对应 assets/img/avatar.png
                                 # （不想用头像就删掉这一行）

  # 文章封面等图片处理
  article:
    math: false
    toc: true                    # 文章内显示目录

  # 评论：先关掉，玩熟了再看第十一节接入 giscus
  comments:
    enabled: false

  # 配色方案：默认深色（赛博朋克霓虹基调），保留右上角切换按钮
  colorScheme:
    toggle: true
    default: "dark"

# 顶部/侧边菜单
menu:
  social:                        # 社交链接（显示在个人卡片下）
    - identifier: github
      name: GitHub
      url: "https://github.com/DrStone-youqiong"
      params:
        icon: brand-github

  main:
    - identifier: quant-resources
      name: 量化研究资源
      url: /quant-resources/
      weight: 1

    - identifier: gallery
      name: 相册
      url: /gallery/
      weight: 2

# 让文章摘要、代码高亮等更好看
markup:
  goldmark:
    renderer:
      unsafe: true               # 允许 Markdown 里写 HTML
  highlight:
    noClasses: false